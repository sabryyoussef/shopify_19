[options]
; Odoo 19 configuration
admin_passwd = admin_master_change_me
db_name = odoo_test
db_user = odoo
db_password = odoo
addons_path = /opt/odoo/custom-addons/shopify_19,/opt/odoo/custom-addons,/opt/odoo/enterprise,/opt/odoo/odoo/addons
data_dir = /opt/odoo/data
logfile = /opt/odoo/logs/odoo.log
log_level = info
http_port = 8069
gevent_port = 8072
workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
proxy_mode = True
